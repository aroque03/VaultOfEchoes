<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault of Echoes — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --surface:#161a22; --border:#2c3547;
  --text:#e8dcc0; --dim:#7f93b8; --gold:#f2a03d;
  --ok:#5fbf7d; --danger:#e2554e; --blue:#5b8def;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"Press Start 2P",monospace;
  padding:20px;min-height:100vh;
  -webkit-font-smoothing:none;
}
h1{font-size:14px;color:var(--gold);margin-bottom:6px;letter-spacing:1px}
.sub{font-size:8px;color:var(--dim);margin-bottom:20px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.card{
  background:var(--surface);border:2px solid var(--border);
  padding:14px;box-shadow:0 3px 0 #000;
}
.card .label{font-size:7px;color:var(--dim);letter-spacing:1px;margin-bottom:8px}
.card .value{font-size:18px;color:var(--gold)}
.card .unit{font-size:8px;color:var(--dim);margin-left:4px}

h2{font-size:10px;color:var(--gold);margin:20px 0 10px;letter-spacing:1px}

table{
  width:100%;border-collapse:collapse;font-size:8px;
  background:var(--surface);border:2px solid var(--border);
  box-shadow:0 3px 0 #000;
}
th{
  text-align:left;padding:8px 10px;color:var(--dim);
  border-bottom:2px solid var(--border);letter-spacing:1px;
  font-weight:normal;
}
td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}

.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:8px}
.bar-label{width:120px;color:var(--dim);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:14px;background:var(--bg);border:1px solid var(--border)}
.bar-fill{height:100%;transition:width .3s}
.bar-val{width:40px;color:var(--gold);font-size:8px}

.weight-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:6px;font-size:7px;
}
.weight-cell{
  background:var(--bg);border:1px solid var(--border);
  padding:6px 8px;display:flex;justify-content:space-between;
}
.weight-cell .node{color:var(--dim)}
.weight-cell .w{color:var(--gold);font-variant-numeric:tabular-nums}

.loading{color:var(--dim);font-size:9px;padding:40px;text-align:center}
.error{color:var(--danger);font-size:9px;padding:20px}
.refresh-btn{
  font-family:inherit;font-size:8px;cursor:pointer;color:var(--text);
  background:var(--surface);border:2px solid var(--border);
  padding:6px 12px;box-shadow:0 2px 0 #000;letter-spacing:1px;
  float:right;
}
.refresh-btn:hover{background:#242b38}
.refresh-btn:active{transform:translateY(2px);box-shadow:none}

.timeline{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:8px}
.timeline .day{
  flex:1;min-width:16px;background:var(--blue);
  position:relative;cursor:default;
}
.timeline .day:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;
  transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);
  padding:3px 6px;font-size:7px;color:var(--text);white-space:nowrap;z-index:1;
}
</style>
</head>
<body>
<button class="refresh-btn" onclick="load()">REFRESH</button>
<button class="refresh-btn" style="margin-right:8px" onclick="exportData()">DOWNLOAD JSON</button>
<button class="refresh-btn" style="margin-right:8px" onclick="downloadWeightsJSON()">DOWNLOAD WEIGHTS</button>
<button class="refresh-btn" style="margin-right:8px" onclick="showGraphs()">SHOW GRAPHS</button>
<button class="refresh-btn" style="margin-right:8px" onclick="recomputeWeights()">RECOMPUTE WEIGHTS</button>
<h1>◆ VAULT OF ECHOES — ADMIN</h1>
<span class="sub">Experiment Dashboard</span>

<div id="graphs" style="display:none;margin-top:20px"></div>

<div id="auth" style="display:none;margin-top:40px">
  <label style="font-size:8px;color:var(--dim);letter-spacing:1px">ADMIN PASSWORD</label><br>
  <input id="pwd" type="password" style="font-family:inherit;font-size:10px;background:var(--surface);color:var(--text);border:2px solid var(--border);padding:8px 12px;margin:8px 0;width:220px" autofocus>
  <button onclick="unlock()" style="font-family:inherit;font-size:8px;cursor:pointer;color:var(--text);background:var(--surface);border:2px solid var(--border);padding:8px 12px;box-shadow:0 2px 0 #000;letter-spacing:1px">ENTER</button>
  <div id="authErr" class="error" style="display:none"></div>
</div>
<div id="content" style="display:none"><div class="loading">Loading data...</div></div>

<script>
let adminKey = sessionStorage.getItem("adminKey") || "";

function showLogin(){
  document.getElementById("auth").style.display = "block";
  document.getElementById("content").style.display = "none";
  document.getElementById("pwd").focus();
}

function unlock(){
  adminKey = document.getElementById("pwd").value;
  if(!adminKey){ document.getElementById("authErr").textContent = "Enter a password"; document.getElementById("authErr").style.display = "block"; return; }
  sessionStorage.setItem("adminKey", adminKey);
  document.getElementById("auth").style.display = "none";
  document.getElementById("content").style.display = "block";
  load();
}

document.getElementById("pwd").addEventListener("keydown", function(e){ if(e.key === "Enter") unlock(); });

async function load(){
  const el = document.getElementById("content");
  el.style.display = "block";
  el.innerHTML = '<div class="loading">Loading data...</div>';

  try {
    const r = await fetch("/api/dashboard", { headers: { "x-admin-key": adminKey } });
    if(r.status === 401){ sessionStorage.removeItem("adminKey"); adminKey = ""; showLogin(); document.getElementById("authErr").textContent = "Wrong password"; document.getElementById("authErr").style.display = "block"; return; }
    if(!r.ok) throw new Error("API returned " + r.status);
    const d = await r.json();
    render(d);
  } catch(e){
    el.innerHTML = '<div class="error">Failed to load: ' + e.message + '<br><br>Make sure STORAGE_CONNECTION_STRING is configured in Azure.</div>';
  }
}

function render(d){
  cachedData = d;
  const el = document.getElementById("content");
  let h = "";

  // Summary cards
  h += '<div class="grid">';
  h += card("UNIQUE PLAYERS", d.uniquePlayers);
  h += card("TOTAL SESSIONS", d.totalSessions);
  h += card("COMPLETED ALL 3", d.completedAll3);
  h += card("BUGS REPORTED", d.totalBugs);
  h += card("AVG SEVERITY", d.avgSeverity, "/ 5");
  h += card("AVG DURATION", d.avgDurationMin, "min");
  h += '</div>';

  // Player types
  h += '<h2>Player Type Distribution</h2>';
  const ptTotal = Math.max(1, d.playerTypes.explorer + d.playerTypes.achiever + d.playerTypes.killer);
  h += barRow("Explorer", d.playerTypes.explorer, ptTotal, "var(--ok)");
  h += barRow("Achiever", d.playerTypes.achiever, ptTotal, "var(--gold)");
  h += barRow("Killer", d.playerTypes.killer, ptTotal, "var(--danger)");

  // Bugs by category
  h += '<h2>Bugs by Category</h2>';
  const catMax = Math.max(1, ...Object.values(d.bugsByCategory));
  for(const [cat, n] of Object.entries(d.bugsByCategory).sort((a,b) => b[1]-a[1])){
    h += barRow(cat, n, catMax, "var(--blue)");
  }
  if(Object.keys(d.bugsByCategory).length === 0) h += '<div class="bar-row"><span class="bar-label" style="width:auto;color:var(--dim)">No bugs reported yet</span></div>';

  // Bugs by severity
  h += '<h2>Bugs by Severity</h2>';
  const sevMax = Math.max(1, ...Object.values(d.bugsBySeverity));
  for(let s=1; s<=5; s++){
    h += barRow("Severity " + s, d.bugsBySeverity[s] || 0, sevMax, "var(--gold)");
  }

  // Bugs by level
  h += '<h2>Bugs by Chamber</h2>';
  const lvlMax = Math.max(1, ...Object.values(d.bugsByLevel));
  for(let l=1; l<=3; l++){
    h += barRow("Chamber " + l, d.bugsByLevel[l] || 0, lvlMax, "var(--blue)");
  }

  // Sessions timeline
  if(Object.keys(d.sessionsByDate).length > 0){
    h += '<h2>Sessions Over Time</h2>';
    const dates = Object.entries(d.sessionsByDate).sort((a,b) => a[0].localeCompare(b[0]));
    const maxDay = Math.max(1, ...dates.map(([,v]) => v));
    h += '<div class="timeline">';
    for(const [date, count] of dates){
      const pct = (count / maxDay * 100).toFixed(0);
      h += '<div class="day" style="height:' + pct + '%" data-tip="' + date + ': ' + count + '"></div>';
    }
    h += '</div>';
  }

  // Players table
  h += '<h2>Players</h2>';
  h += '<table><tr><th>ID</th><th>NAME</th><th>EMAIL</th><th>SESSIONS</th></tr>';
  for(const p of d.players){
    h += '<tr><td>' + p.id + '</td><td>' + (p.name||"—") + '</td><td>' + (p.email||"—") + '</td><td>' + p.sessions + '</td></tr>';
  }
  if(d.players.length === 0) h += '<tr><td colspan="4" style="color:var(--dim)">No players yet</td></tr>';
  h += '</table>';

  // Weights
  if(d.weights){
    for(const type of ["explorer","achiever","killer"]){
      if(!d.weights[type]) continue;
      h += '<h2>Weights — ' + type.charAt(0).toUpperCase() + type.slice(1) + '</h2>';
      h += '<div class="weight-grid">';
      for(const [node, w] of Object.entries(d.weights[type])){
        const color = w > 1 ? 'color:var(--danger)' : '';
        h += '<div class="weight-cell"><span class="node">' + node + '</span><span class="w" style="' + color + '">' + w.toFixed(2) + '</span></div>';
      }
      h += '</div>';
    }
  } else {
    h += '<h2>Weights</h2><div class="bar-row"><span style="color:var(--dim);font-size:8px">No weights accumulated yet (defaults: all 1.00)</span></div>';
  }

  el.innerHTML = h;
}

function card(label, value, unit){
  return '<div class="card"><div class="label">' + label + '</div><div class="value">' + value + (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div></div>';
}

function barRow(label, value, max, color){
  const pct = (value / max * 100).toFixed(0);
  return '<div class="bar-row"><span class="bar-label">' + label + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div><span class="bar-val">' + value + '</span></div>';
}

async function exportData(){
  if(!adminKey){ showLogin(); return; }
  try {
    const r = await fetch("/api/export", { headers: { "x-admin-key": adminKey } });
    if(r.status === 401){ showLogin(); return; }
    if(!r.ok) throw new Error("API returned " + r.status);
    const blob = await r.blob();
    const d = new Date().toISOString().slice(0,10);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "vault-sessions-" + d + ".json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch(e){
    alert("Export failed: " + e.message);
  }
}

async function recomputeWeights(){
  if(!adminKey){ showLogin(); return; }
  try {
    const r = await fetch("/api/recompute", { method: "POST", headers: { "x-admin-key": adminKey } });
    if(r.status === 401){ showLogin(); return; }
    if(!r.ok) throw new Error("API returned " + r.status);
    const d = await r.json();
    alert("Recomputed: " + d.sessionsProcessed + " sessions, " + d.updatesApplied + " weight updates applied.");
    load();
  } catch(e){
    alert("Recompute failed: " + e.message);
  }
}

// ---------- DAG definition (mirrors progression.js) ----------
const DAG_EDGES = {
  "l1.entry":["l1.room","l1.chest","l1.boss","l1.key"],
  "l1.room":["l1.key"], "l1.chest":["l1.key"], "l1.boss":["l1.key"],
  "l1.key":["l1.exit"], "l1.exit":["l2.entry"],
  "l2.entry":["l2.room","l2.chest","l2.boss","l2.key"],
  "l2.room":["l2.key"], "l2.chest":["l2.key"], "l2.boss":["l2.key"],
  "l2.key":["l2.exit"], "l2.exit":["l3.entry"],
  "l3.entry":["l3.room","l3.chest","l3.boss","l3.greenBoss","l3.key"],
  "l3.room":["l3.key"], "l3.chest":["l3.key"], "l3.boss":["l3.key"],
  "l3.greenBoss":["l3.key"], "l3.key":["l3.exit"], "l3.exit":[],
};

const TYPE_COLORS = {explorer:"#5fbf7d", achiever:"#f2a03d", killer:"#e2554e"};
const TYPE_BG     = {explorer:"#1a2e22", achiever:"#2e2518", killer:"#2e1a1a"};

let cachedData = null;

function downloadWeightsJSON(){
  if(!cachedData || !cachedData.weights){ alert("No weights data loaded yet. Hit REFRESH first."); return; }
  const payload = { _exported: new Date().toISOString(), dag_edges: DAG_EDGES };
  for(const t of ["explorer","achiever","killer"]){
    payload[t] = cachedData.weights[t] || {};
  }
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url;
  a.download = "vault-weights-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function showGraphs(){
  if(!cachedData){ alert("No data loaded yet. Hit REFRESH first."); return; }
  const el = document.getElementById("graphs");
  el.style.display = "block";
  el.innerHTML = "";
  for(const type of ["explorer","achiever","killer"]){
    const w = (cachedData.weights && cachedData.weights[type]) || {};
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "20px";
    const title = document.createElement("h2");
    title.textContent = "Progression DAG — " + type.charAt(0).toUpperCase() + type.slice(1);
    title.style.cssText = "font-size:10px;color:" + TYPE_COLORS[type] + ";letter-spacing:1px;margin:20px 0 8px";
    wrap.appendChild(title);
    const cvs = document.createElement("canvas");
    cvs.width = 960; cvs.height = 420;
    cvs.style.cssText = "width:100%;max-width:960px;background:" + TYPE_BG[type] + ";border:2px solid #2c3547;box-shadow:0 3px 0 #000";
    wrap.appendChild(cvs);
    const btn = document.createElement("button");
    btn.className = "refresh-btn";
    btn.style.cssText = "float:none;margin-top:6px";
    btn.textContent = "SAVE AS PNG";
    btn.onclick = (function(c, t){ return function(){
      const a = document.createElement("a"); a.download = "dag-" + t + ".png"; a.href = c.toDataURL("image/png");
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };})(cvs, type);
    wrap.appendChild(btn);
    el.appendChild(wrap);
    drawDAG(cvs, w, type);
  }
  el.scrollIntoView({behavior:"smooth"});
}

function drawDAG(cvs, weights, type){
  const ctx = cvs.getContext("2d");
  const W = cvs.width, H = cvs.height;
  const accent = TYPE_COLORS[type];

  // Node positions: 3 levels, each with spine + branches
  const nodes = {};
  const levels = [
    {prefix:"l1", branches:["room","chest","boss"]},
    {prefix:"l2", branches:["room","chest","boss"]},
    {prefix:"l3", branches:["room","chest","boss","greenBoss"]},
  ];

  const colW = W / 3;
  levels.forEach((lv, li) => {
    const cx = colW * li + colW / 2;
    const bCount = lv.branches.length;
    // Spine: entry at top, key below branches, exit at bottom
    nodes[lv.prefix+".entry"] = {x: cx, y: 40, label: "entry"};
    nodes[lv.prefix+".key"]   = {x: cx, y: H - 100, label: "key"};
    nodes[lv.prefix+".exit"]  = {x: cx, y: H - 40, label: "exit"};
    // Branches fanned between entry and key
    const bStartY = 120, bEndY = H - 160;
    const bSpacing = bCount > 1 ? (colW - 80) / (bCount - 1) : 0;
    const bStartX = cx - (bCount - 1) * bSpacing / 2;
    lv.branches.forEach((br, bi) => {
      const bx = bStartX + bi * bSpacing;
      const by = (bStartY + bEndY) / 2;
      nodes[lv.prefix+"."+br] = {x: bx, y: by, label: br};
    });
  });

  // Draw edges
  ctx.lineWidth = 1.5;
  for(const [from, tos] of Object.entries(DAG_EDGES)){
    const nf = nodes[from]; if(!nf) continue;
    for(const to of tos){
      const nt = nodes[to]; if(!nt) continue;
      ctx.strokeStyle = "rgba(127,147,184,0.3)";
      ctx.beginPath();
      ctx.moveTo(nf.x, nf.y); ctx.lineTo(nt.x, nt.y);
      ctx.stroke();

      // Weight label on edge midpoint
      const wVal = weights[from];
      if(wVal !== undefined){
        const mx = (nf.x + nt.x) / 2, my = (nf.y + nt.y) / 2;
        // Offset slightly to avoid overlap
        const dx = nt.x - nf.x, dy = nt.y - nf.y;
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        const ox = (-dy/len) * 10, oy = (dx/len) * 10;
      }
    }
  }

  // Draw nodes
  const R = 22;
  for(const [nid, nd] of Object.entries(nodes)){
    const wVal = weights[nid];
    const isSpine = nid.endsWith(".entry") || nid.endsWith(".key") || nid.endsWith(".exit");
    // Node circle
    ctx.beginPath();
    ctx.arc(nd.x, nd.y, R, 0, Math.PI * 2);
    ctx.fillStyle = isSpine ? "#222a3c" : "#1b2130";
    ctx.fill();
    ctx.strokeStyle = isSpine ? accent : "rgba(127,147,184,0.5)";
    ctx.lineWidth = isSpine ? 2.5 : 1.5;
    ctx.stroke();

    // Node label
    ctx.fillStyle = isSpine ? "#e8dcc0" : "#7f93b8";
    ctx.font = "bold 8px 'Press Start 2P', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(nd.label, nd.x, nd.y - 2);

    // Weight value below label
    if(wVal !== undefined){
      ctx.fillStyle = wVal > 1 ? "#e2554e" : accent;
      ctx.font = "7px 'Press Start 2P', monospace";
      ctx.fillText(wVal.toFixed(2), nd.x, nd.y + 10);
    } else {
      ctx.fillStyle = "#555";
      ctx.font = "7px 'Press Start 2P', monospace";
      ctx.fillText("1.00", nd.x, nd.y + 10);
    }
  }

  // Level labels
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.font = "bold 9px 'Press Start 2P', monospace";
  levels.forEach((lv, li) => {
    ctx.fillStyle = accent;
    ctx.fillText("CHAMBER " + (li+1), colW * li + colW / 2, 8);
  });

  // Arrow on cross-level edges
  ctx.strokeStyle = accent; ctx.lineWidth = 2;
  [["l1.exit","l2.entry"],["l2.exit","l3.entry"]].forEach(([f,t]) => {
    const nf = nodes[f], nt = nodes[t]; if(!nf || !nt) return;
    ctx.beginPath(); ctx.moveTo(nf.x, nf.y); ctx.lineTo(nt.x, nt.y); ctx.stroke();
    const ang = Math.atan2(nt.y - nf.y, nt.x - nf.x);
    const ax = nt.x - Math.cos(ang) * R, ay = nt.y - Math.sin(ang) * R;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 8 * Math.cos(ang - 0.4), ay - 8 * Math.sin(ang - 0.4));
    ctx.lineTo(ax - 8 * Math.cos(ang + 0.4), ay - 8 * Math.sin(ang + 0.4));
    ctx.closePath(); ctx.fillStyle = accent; ctx.fill();
  });
}

if(adminKey) load(); else showLogin();
</script>
</body>
</html>
